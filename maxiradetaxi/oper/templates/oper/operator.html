{% extends 'login/layout.html' %}
{% load render_table from django_tables2 %}

{% block title %}Операторська панель{% endblock %}

{% block body %}

<h1 class="text-center">
    Операторська панель
    {{user.username}}
    <button onclick="location.href='{% url 'logout' %}'" type="button" class="btn btn-primary text-center">Вийти</button>
</h1>
<div class="container">
  <div class="row">
    <div class="col-5 p-2 overflow-auto">
        <button onclick="location.href='{% url 'driver' %}'" type="button" class="btn btn-primary">Новий водій</button>
        {% render_table drivers_table %}

    </div>

    <div class="col-7 p-2 overflow-auto text-rights">
        <button onclick="location.href='{% url 'order' %}'" type="button" class="btn btn-primary">Замовлення</button>
        {% render_table orders_table %}
    </div>
  </div>
</div>

{% endblock %}
